function past(){const qs=BANK.filter(q=>q.year);$('#app').innerHTML=`<section class="card"><h2>历年题 · 可追溯练习</h2><p>已核验 2023 年公开回忆判断题和 2025 年法规回忆考点。当前收录 ${qs.filter(q=>q.kind==='回忆题原句').length} 道短句回忆题、${qs.filter(q=>q.kind==='回忆考点改编').length} 道独立改编题。</p><p class="warning">资料来自培训机构考生回忆，非主管部门公布原卷。2024 年只提供资料入口，未取得完整题文，不标称逐题核验。不虚构未公开的历年原题。</p><div class="row"><button class="primary" onclick="start(BANK.filter(q=>q.year),'practice','历年回忆考点训练')">练习已核验题</button></div>${[2025,2023].map(y=>`<p><b>${y} 年：</b>${link('r'+y)} <button onclick="start(BANK.filter(q=>q.year===${y}),'practice','${y} 回忆考点')">练习</button></p>`).join('')}<p><b>2024 年：</b><a target="_blank" rel="noopener" href="https://www.hqwx.com/dyz-kaoshi/ziliaolm/1062935.html">卷一回忆资料入口</a> · <a target="_blank" rel="noopener" href="https://www.hqwx.com/dyz-kaoshi/ziliaolm/1062936.html">卷二回忆资料入口</a>（可能需要登录）</p></section><section class="card"><h3>怎样核验与改编</h3><p>回忆摘要中的撤销权期限需要区分重大误解、欺诈、胁迫；不能把所有情形都写成一个期限。本库以现行法条重新设置情境，并逐题标出回忆考点位置和答案依据。</p><p>模考其他题目均标注“模拟题”，以法条、国家标准及权威文化遗产资料为依据独立编写。</p></section>`}
function bounds(){return session.full?[session.stage===1?0:165,session.stage===1?165:330]:[0,session.ids.length]}
function quiz(){if(!session)return go('home');const s=session,q=byId[s.ids[s.i]],[lo,hi]=bounds(),a=s.answers[q.id]||[],checked=s.mode!=='exam'&&s.checked[q.id];$('#app').innerHTML=`<section class="card"><div class="row"><span class="tag">${esc(s.title)}${s.full?' · 当前卷'+s.stage:''}</span>${s.deadline?'<span class="timer" id="clock"></span>':''}<span>${s.i-lo+1}/${hi-lo}</span></div><progress value="${s.ids.slice(lo,hi).filter(id=>(s.answers[id]||[]).length).length}" max="${hi-lo}"></progress><div class="row"><span class="tag">${names[q.subject]}</span><span class="tag">${types[q.type]}</span><span class="tag">${esc(q.kind)}</span>${q.year?`<span class="tag">${q.year}</span>`:''}</div><h2 class="question">${esc(q.q)}</h2>${s.orders[q.id].map((v,i)=>`<button class="option ${a.includes(v)?'selected':''} ${checked?(q.answer.includes(v)?'correct':a.includes(v)?'wrong':''):''}" ${checked?'disabled':''} onclick="choose(${v})"><b>${String.fromCharCode(65+i)}</b><span>${esc(q.options[v])}</span></button>`).join('')}<small>${q.type==='M'?'多选：选择所有符合条件的选项。':'选择一个答案。'}</small>${checked?explanation(q):''}<div class="row">${s.mode!=='exam'&&!checked?`<button class="primary" onclick="check()" ${a.length?'':'disabled'}>提交答案</button>`:''}<button onclick="move(-1)" ${s.i===lo?'disabled':''}>上一题</button><button onclick="move(1)" ${s.i===hi-1?'disabled':''}>下一题</button><button onclick="flag()">${s.flags[q.id]?'取消标记':'标记疑问'}</button><button onclick="submit()">${s.full&&s.stage===1?'交卷一，进入卷二':'结束并查看结果'}</button></div><details><summary>答题卡 · 已答 ${s.ids.slice(lo,hi).filter(id=>(s.answers[id]||[]).length).length}/${hi-lo} · 粗边为标记题</summary><div class="numbers">${s.ids.slice(lo,hi).map((id,i)=>`<button class="${(s.answers[id]||[]).length?'done':''} ${s.flags[id]?'flag':''}" onclick="jump(${lo+i})">${i+1}</button>`).join('')}</div></details></section>`;tick()}
function choose(v){const q=byId[session.ids[session.i]];if(session.checked[q.id])return;let a=session.answers[q.id]||[];session.answers[q.id]=q.type==='M'?(a.includes(v)?a.filter(x=>x!==v):[...a,v]):[v];save();quiz()}
function explanation(q){return `<div class="explain"><b>正确答案：</b>${q.answer.map(i=>esc(q.options[i])).join('；')}<p>${esc(q.explanation)}</p><small>答案依据：${link(q.source)} · ${esc(q.locator)}${q.recallSource?`<br>回忆出处：${link(q.recallSource)} · ${esc(q.recallLocator)}<br>${esc(q.recallNote)}`:''}</small></div>`}
function record(q){const correct=Engine.equal(q.answer,session.answers[q.id]||[]);if(!correct)state.wrong[q.id]={day:Engine.date(),count:(state.wrong[q.id]?.count||0)+1};else if(state.wrong[q.id])delete state.wrong[q.id]}
function check(){const q=byId[session.ids[session.i]];if(!(session.answers[q.id]||[]).length)return;session.checked[q.id]=true;record(q);save();quiz()}
function move(n){const [lo,hi]=bounds();session.i=Math.max(lo,Math.min(hi-1,session.i+n));save();quiz()}
function jump(i){session.i=i;save();quiz()}
function flag(){const id=session.ids[session.i];session.flags[id]=!session.flags[id];save();quiz()}
function submit(auto=false){let[lo,hi]=bounds(),missing=session.ids.slice(lo,hi).filter(id=>!(session.answers[id]||[]).length).length;if(!auto&&!confirm(`本卷/练习还有 ${missing} 道未答。确定提交？${session.full&&session.stage===1?'提交后无法返回卷一。':''}`))return;if(session.full&&session.stage===1){session.stage=2;session.i=165;session.deadline=auto?session.deadline+90*60000:Date.now()+90*60000;save();go('quiz')}else finish()}
function finish(){const s=session;let total=0,max=0;const rows=names.slice(1).map((n,i)=>{let qs=s.ids.map(id=>byId[id]).filter(q=>q.subject===i+1),score=qs.reduce((v,q)=>v+Engine.score(q,s.answers[q.id]),0),m=qs.reduce((v,q)=>v+(q.type==='M'?1:.5),0);total+=score;max+=m;return qs.length?`<p>${n}：${score}/${m} 分</p>`:''}).join('');s.ids.forEach(id=>record(byId[id]));const completed=s.ids.every(id=>(s.answers[id]||[]).length);if(s.mode==='daily'&&completed)state.days[s.day]=true;state.history.push({day:Engine.date(),title:s.title,score:total,max});state.history=state.history.slice(-50);const errors=s.ids.filter(id=>!Engine.equal(byId[id].answer,s.answers[id]||[]));session=null;save();page='result';nav();$('#app').innerHTML=`<section class="card"><h2>${esc(s.title)} · 已完成</h2><div class="stat">${total} / ${max} 分</div>${rows}<p>错题及未答 ${errors.length} 道，已加入或保留在错题本。${s.mode==='daily'&&!completed?'今日题尚未答齐，不计过关。':''}</p><p class="muted">这是练习成绩，不设置或推测官方合格线。</p><button onclick="go('wrong')">复习错题</button> <button onclick="go('home')">回到首页</button></section>${s.ids.map((id,i)=>{const q=byId[id],a=s.answers[id]||[];return `<details class="card"><summary>${i+1}. ${Engine.equal(q.answer,a)?'✓':'✗'} ${esc(q.q)}</summary><p>你的答案：${a.map(v=>esc(q.options[v])).join('；')||'未答'}</p>${explanation(q)}</details>`}).join('')}`}
function tick(){if(session?.deadline){const left=session.deadline-Date.now();if(left<=0){submit(true);return}const el=$('#clock');if(el)el.textContent=`剩余 ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`}if(oralEnd&&$('#oralClock')){let n=Math.max(0,Math.ceil((oralEnd-Date.now())/1000));$('#oralClock').textContent=n?`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`:'练习时间到';if(!n)oralEnd=0}}

function unitQuestions(id){return BANK.filter(q=>q.unit===id)}

function learn(){const done=COURSE.filter(c=>state.read[c.id]).length;$('#app').innerHTML=`<section class="card"><span class="tag">考纲学习地图 · 39 个专题</span><h2>先理解知识，再用题目检验</h2><p>专题名称按 2026 官方考纲整理；学习卡为本站独立归纳，<b>不是出版社教材原文或官方教材配套</b>。科目四按地域组织，跨区题只归入一个主要导航位置。</p><p>已标记阅读 ${done}/39 个专题。阅读、做题与掌握是不同指标；这里不计算“考纲掌握率”。</p><div class="row">${names.slice(1).map((n,i)=>`<button class="${subjectFilter===i+1?'active':''}" onclick="subjectFilter=${i+1};learn()">${n}</button>`).join('')}</div></section><div class="grid">${COURSE.filter(c=>c.subject===subjectFilter).map(c=>{const x=stats(c.id);return `<article class="card"><span class="tag">${x.total?'局部练习':READING[c.id]?'可阅读 · 练习待补':'待补题目'}</span><h3>${esc(c.title)}</h3><p>${esc(c.scope)}</p><small>本站 ${x.total} 题 · 已练 ${x.seen} 题 · 最近答对 ${x.right} 题${x.due?' · 到期复习 '+x.due+' 题':''}</small><p>${state.read[c.id]?'✓ 已标记阅读':'尚未标记阅读'}</p><button onclick="lesson('${c.id}')">${READING[c.id]?'阅读学习':'学习与练习'}</button></article>`}).join('')}</div>`}
function lesson(id){const c=COURSE.find(c=>c.id===id),qs=unitQuestions(id),topics=[...new Set(qs.map(q=>q.topic))],src=[...new Set(qs.map(q=>q.source))];page='learn';nav();$('#app').innerHTML=`<section class="card"><button onclick="go('learn')">← 返回学习地图</button><p class="tag">${names[c.subject]} · ${esc(c.title)}</p><h2>${esc(c.title)}</h2><p><b>考纲范围：</b>${esc(c.scope)}</p><p>${link('outline','官方笔试大纲')} · PDF 第 ${c.page} 页起（专题可能跨页）</p><div class="warning"><b>${qs.length?'局部有题，尚未全覆盖':'此专题暂无练习题'}</b><br>${esc(c.gap)}</div><h3 style="margin-top:24px">建议学习顺序</h3><ol><li>对照当年教材目录定位同名知识点，阅读完整章节；本站不冒填教材页码。</li><li>阅读下方知识卡，说明条件、适用范围和易混区别。</li><li>关闭知识卡，完成专题练习；复盘时回到引用依据核查。</li></ol><div class="row"><button onclick="state.read['${id}']=!state.read['${id}'];save();lesson('${id}')">${state.read[id]?'取消阅读标记':'标记已阅读'}</button><button class="primary" ${qs.length?'':'disabled'} onclick="start(unitQuestions('${id}'),'chapter','${esc(c.title)} · 专题练习')">练习本专题 · ${qs.length}题</button><button ${qs.length?'':'disabled'} onclick="start(Engine.shuffle(unitQuestions('${id}')).slice(0,10),'chapter','${esc(c.title)} · 10题以内自测')">抽题自测</button></div></section>${c.notes?.length?`<section class="card"><h3>先掌握这些规则</h3>${c.notes.map(([title,body,source,loc])=>`<h3 style="margin-top:20px">${esc(title)}</h3><p>${esc(body)}</p><small>${link(source)} · ${esc(loc)}</small>`).join('')}</section>`:''}${topics.length?`<section class="card"><h3>知识卡 · 独立归纳</h3><p class="muted">按题目所属考点归纳，只覆盖本库已核验内容。展开后含答案要点，建议先学习、再闭卷练习。</p>${topics.map(t=>{const group=qs.filter(q=>q.topic===t);return `<details><summary>${esc(t)} · ${group.length}题</summary>${[...new Set(group.map(q=>q.explanation))].map(e=>`<p>${esc(e)}</p>`).join('')}<small>核验依据：${[...new Set(group.map(q=>q.source))].map(k=>link(k)).join(' · ')}</small></details>`}).join('')}</section>`:''}<section class="card"><h3>本专题参考资料</h3>${src.length?src.map(k=>`<p>${link(k)}</p>`).join(''):'<p>先按考纲在当年教材中学习；本站尚未建立本专题独立知识卡。</p>'}<button onclick="go('resources')">查看教材与课程选择建议</button></section>`;window.scrollTo(0,0)}
function startDaily(){const day=Engine.date();let ids=state.dailyPlans[day];if(!ids){let picked=[],seed=[...day].reduce((n,c)=>n*31+c.charCodeAt(0),0);for(const [t,n] of [['T',4],['S',6],['M',2]]){const pool=BANK.filter(q=>q.type===t),due=Engine.shuffle(pool.filter(q=>state.wrong[q.id]&&(!state.wrong[q.id].due||state.wrong[q.id].due<=day)),seed);const fresh=Engine.shuffle(pool.filter(q=>!state.performance[q.id]&&!state.wrong[q.id]),seed+1);const rest=Engine.shuffle(pool,seed+2);const list=[...due.slice(0,Math.ceil(n/2)),...fresh,...rest];const unique=[...new Map(list.map(q=>[q.id,q])).values()];picked.push(...unique.slice(0,n))}ids=picked.map(q=>q.id);state.dailyPlans[day]=ids;save()}start(ids.map(id=>byId[id]).filter(Boolean),'daily','每日闯关 · 复习与新题')}
function record(q){session.recorded=session.recorded||{};if(session.recorded[q.id])return;session.recorded[q.id]=true;const correct=Engine.equal(q.answer,session.answers[q.id]||[]),day=Engine.date(),old=state.performance[q.id];state.performance[q.id]={correct,day,attempts:(old?.attempts||0)+1};if(!correct){state.wrong[q.id]={day,count:(state.wrong[q.id]?.count||0)+1,streak:0,due:dayAfter(day,1)}}else if(state.wrong[q.id]){let w=state.wrong[q.id];if(w.lastPass!==day){w.streak=(w.streak||0)+1;w.lastPass=day;if(w.streak>=3){delete state.wrong[q.id];return}w.due=dayAfter(day,[1,3,7][w.streak])}}}
function dayAfter(day,n){const d=new Date(day+'T00:00:00+08:00');d.setUTCDate(d.getUTCDate()+n);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function wrong(){const ids=Object.keys(state.wrong).filter(id=>byId[id]),due=ids.filter(id=>!state.wrong[id].due||state.wrong[id].due<=Engine.date());$('#app').innerHTML=`<section class="card"><h2>错题复习</h2><p>待巩固 ${ids.length} 题 · 今天到期 ${due.length} 题</p><p>答错后次日复习；答对后分别隔 3 天、7 天再检验。不同日期累计答对 3 次才移出，同日反复作答不累计。未答题也会收录。</p><div class="row"><button class="primary" ${due.length?'':'disabled'} onclick="start(Object.keys(state.wrong).filter(id=>byId[id]&&(!state.wrong[id].due||state.wrong[id].due<=Engine.date())).map(id=>byId[id]),'practice','到期错题复习')">复习到期题</button><button ${ids.length?'':'disabled'} onclick="start(Object.keys(state.wrong).filter(id=>byId[id]).map(id=>byId[id]),'practice','全部错题巩固')">提前练习全部错题</button></div></section>${ids.map(id=>{const q=byId[id],w=state.wrong[id];return `<article class="card"><span class="tag">${names[q.subject]}</span><p>${esc(q.q)}</p><small>答对巩固 ${w.streak||0}/3 次 · 下次 ${w.due||'今天'} · ${esc(COURSE.find(c=>c.id===q.unit).title)}</small><p><button onclick="lesson('${q.unit}')">回到知识点</button></p></article>`}).join('')}`}
function resources(){$('#app').innerHTML=`<section class="card"><h2>教材与资料路线</h2><p><b>主线建议：同一出版社当年四科教材 → 配套章节习题 → 历年回忆考点 → 完整限时模考。</b></p><p>中国旅游出版社、旅游教育出版社均有导游考试教材。选择其中一套对应当年考纲的版本即可，先核对版权页、目录和勘误；“统编”“正版”不等于文旅部指定。</p><p><a href="https://jnwl.jinan.gov.cn/api-gateway/jpaas-jact-web-server/front/mail-pub-detail?iid=3cd9fe9d946b43f18b5fadd7f37a6bce" target="_blank" rel="noopener">文旅局公开答复：不指定教材及常用出版社</a></p><div class="warning">本站尚未取得出版社教材全文，也没有声称与某版教材逐页配套。学习地图依据官方考纲，知识卡来自所列公开权威资料和独立归纳；现有题量不等于大纲覆盖度。</div></section><section class="card"><h3>四科怎样用教材</h3><ul><li>政策法规：理解主体、条件、期限、费用与责任；核查新法及新政策。</li><li>导游业务：按接待流程学习，再用异常情境检验处置次序。</li><li>全国基础：建立历史、文学、建筑、宗教、地理等知识体系，比较相近概念。</li><li>地方基础：按省区市整理概况、饮食物产、民俗、非遗、景区，不能只背北京和世界遗产。</li></ul><p>书名对应《政策与法律法规》《导游业务》《全国导游基础知识》《地方导游基础知识》。配套练习优先选有章节归属、详细解析及勘误的版本。</p></section><section class="card"><h3>培训资料与面试</h3><p><a href="https://www.hqwx.com/classlist/" target="_blank" rel="noopener">环球网校课程与试听入口</a>可用于比较讲解方式；本站未逐节评测课程，不承诺通过率。确认适用年份、北京面试范围与课程有效期，再决定是否购买。</p><p><a href="https://whlyj.beijing.gov.cn/zwgk/tzgg/202607/P020260731709313684567.pdf" target="_blank" rel="noopener">北京官方现场考试大纲</a>用来核对景点范围。景点讲解书帮助组织内容，事实仍应以官方景区或文博资料核验。</p><p>已获取的历年资料是机构回忆版，可能有遗漏或错误；在“历年题”中保留出处与改编说明。</p><button onclick="go('past')">历年回忆资料</button> <button onclick="go('sources')">全部核验来源</button></section>`}
const homeBase=home;
function showHomeLearning(){const due=Object.keys(state.wrong).filter(id=>byId[id]&&(!state.wrong[id].due||state.wrong[id].due<=Engine.date())).length;const candidates=COURSE.map(c=>({...c,...stats(c.id)})).filter(c=>c.total).sort((a,b)=>((a.seen?a.right/a.seen:0)-(b.seen?b.right/b.seen:0))||a.seen-b.seen).slice(0,3);$('#app').insertAdjacentHTML('afterbegin',`<section class="card"><span class="tag">第 5 版 · 网页阅读笔记</span><h2>从知识点开始补薄弱项</h2><p>今天 ${due} 道错题到期。每日题单在首次开始时固定，优先安排到期错题与未练题；题型仍为 4 判断、6 单选、2 多选。</p><div class="row"><button class="primary" onclick="go('learn')">打开分章学习地图</button><button onclick="go('reading')">阅读原空白专题</button><button onclick="go('resources')">教材与资料路线</button></div><p>建议先学：${candidates.map(c=>`<button onclick="lesson('${c.id}')">${esc(c.title)} · ${c.seen?'最近答对 '+c.right+'/'+c.seen:'尚未练习'}</button>`).join(' ')}</p><small>建议仅依据本站作答；“最近答对”是已练题的最近一次结果，不代表整章掌握。</small></section>`)}

function nav(){const items=[['home','今日闯关'],['learn','分章学习'],['reading','阅读笔记'],['mock','模拟考试'],['past','历年题'],['wrong','错题复习'],['oral','北京面试'],['resources','教材资料']];$('#nav').innerHTML=items.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}

function reading(){const query=readingQuery.trim().toLowerCase(),units=COURSE.filter(c=>READING[c.id]&&(!query||JSON.stringify([c.title,READING[c.id]]).toLowerCase().includes(query)));$('#app').innerHTML=`<section class="card"><span class="tag">12 个原空白专题 · 网页阅读版</span><h2>没有练习题，也能直接学</h2><p>每篇都有知识正文、例子或对照表，以及展开核对的自查问答。来源收在文末，阅读不需要打开 PDF。</p><div class="row"><label for="readSearch">搜索笔记</label><input id="readSearch" placeholder="例如：保证金、东北、护照" value="${esc(readingQuery)}"><button onclick="readingQuery=$('#readSearch').value;reading()">搜索</button><button onclick="readingQuery='';reading()">全部</button><button onclick="downloadReadings()">下载全部笔记（HTML）</button></div><small>整理于 2026-11-10，内容为本站归纳的基础学习笔记，不是完整教材；时政条目为精选，注明统计期间。</small></section><div class="grid">${units.map(c=>{const a=READING[c.id],chars=a.sections.reduce((n,s)=>n+s.paragraphs.join('').length,0);return `<article class="card"><span class="tag">${names[c.subject]}</span><h3>${esc(c.title)}</h3><p>${esc(a.intro)}</p><small>${a.sections.length} 小节 · 约 ${Math.max(2,Math.ceil(chars/250))} 分钟 · ${state.read[c.id]?'已标记阅读':'未标记阅读'}</small><div class="row"><button class="primary" onclick="readArticle('${c.id}')">开始阅读</button>${state.readBookmarks[c.id]!==undefined?`<button onclick="readArticle('${c.id}',true)">继续书签</button>`:''}</div></article>`}).join('')||'<p>没有匹配的笔记，请换一个关键词。</p>'}</div>`}
function sectionHTML(s,i,id,offline=false){return `<section class="reading-section" id="read-section-${id}-${i}"><h3>${i+1}. ${esc(s.title)}</h3>${s.paragraphs.map(t=>`<p>${esc(t)}</p>`).join('')}${s.table?`<div class="table-scroll"><table><thead><tr>${s.table[0].map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${s.table.slice(1).map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${s.example?`<div class="explain">${esc(s.example)}</div>`:''}<small>依据：${s.refs.map(k=>esc(SOURCES[k][0])).join('；')}</small>${offline?'':`<div class="row"><button onclick="bookmarkRead('${id}',${i})">读到这里 · 保存书签</button><span id="bookmark-${i}" role="status">${state.readBookmarks[id]===i?'已保存书签':''}</span></div>`}</section>`}
function readArticle(id,resume=false){const a=READING[id],c=COURSE.find(x=>x.id===id);page='reading';nav();$('#app').innerHTML=`<article class="card reader" style="font-size:${state.readerSize}px"><div class="row"><button onclick="go('reading')">← 阅读目录</button><button onclick="subjectFilter=${c.subject};go('learn')">返回本科专题</button><button onclick="resizeReader(-1)">字号 −</button><button onclick="resizeReader(1)">字号 ＋</button></div><span class="tag">${names[c.subject]} · 基础学习笔记</span><h2>${esc(c.title)}</h2><p class="lead">${esc(a.intro)}</p><p class="muted">整理日期：${a.updated}。${esc(a.limit)}</p><details class="reader-toc" open><summary>本篇目录</summary><ol>${a.sections.map((s,i)=>`<li><a href="#read-section-${id}-${i}">${esc(s.title)}</a></li>`).join('')}</ol></details>${a.sections.map((s,i)=>sectionHTML(s,i,id)).join('')}<section class="reading-section"><h3>读完试着回答</h3><p>先自己口述，再展开参考答案。不计入题库得分。</p>${a.checks.map(([q,ans])=>`<details class="explain"><summary>${esc(q)}</summary><p>${esc(ans)}</p></details>`).join('')}</section><div class="row"><button class="primary" onclick="toggleRead('${id}')" id="readDone">${state.read[id]?'已标记阅读 · 点击取消':'标记本篇已阅读'}</button><button onclick="go('reading')">读下一篇</button><span role="status" id="readDoneStatus"></span></div><details><summary>核验来源（需要时再打开原文）</summary>${[...new Set(a.sections.flatMap(s=>s.refs))].map(k=>`<p>${link(k)}</p>`).join('')}</details></article>`;if(resume&&state.readBookmarks[id]!==undefined)document.getElementById(`read-section-${id}-${state.readBookmarks[id]}`)?.scrollIntoView();else window.scrollTo(0,0)}
function resizeReader(n){state.readerSize=Math.max(16,Math.min(24,state.readerSize+n));$('.reader').style.fontSize=state.readerSize+'px';save()}

function readingDocument(){return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导游备考 · 12专题阅读笔记</title><style>body{font:18px/1.9 system-ui;color:#18372f;max-width:850px;margin:auto;padding:24px}article{padding:24px 0;border-bottom:2px solid #ccd8cf}h2{margin-top:48px}h3{margin-top:30px}table{border-collapse:collapse;width:100%}td,th{padding:10px;border:1px solid #ccc;text-align:left}.table-scroll{overflow:auto}small{font-size:13px;color:#567}a{color:#176b50}.row{display:none}@media print{article{break-before:page}}</style><h1>导游备考 · 12专题阅读笔记</h1><p>整理日期：2026-11-10。基础学习归纳，非完整教材；时政与政策请留意更新。正文可离线阅读，核验链接需要联网。</p><ol>${COURSE.filter(c=>READING[c.id]).map(c=>`<li><a href="#unit-${c.id}">${esc(c.title)}</a></li>`).join('')}</ol>${COURSE.filter(c=>READING[c.id]).map(c=>{const a=READING[c.id];return `<article id="unit-${c.id}"><h2>${esc(c.title)}</h2><p>${esc(a.intro)}</p><p>${esc(a.limit)}</p>${a.sections.map((s,i)=>sectionHTML(s,i,c.id,true)).join('')}<h3>自查问答</h3>${a.checks.map(([q,ans])=>`<details><summary>${esc(q)}</summary><p>${esc(ans)}</p></details>`).join('')}<h3>核验来源</h3>${[...new Set(a.sections.flatMap(s=>s.refs))].map(k=>`<p>${link(k)}</p>`).join('')}</article>`}).join('')}</html>`}
