</style></head><body><div class="app"><div class="top"><span class="chip">🏯 北京考区 · 初考 2026</span><span class="chip" id="date"></span></div><main id="main"></main></div><nav class="tabs"><button data-tab="home" onclick="jump('home')">🏠<br>今日</button><button data-tab="plan" onclick="jump('plan')">🗓<br>计划</button><button data-tab="wrong" onclick="jump('wrong')">📕<br>错题</button><button data-tab="speak" onclick="jump('speak')">🎙️<br>面试</button><button data-tab="library" onclick="jump('library')">📚<br>题库</button></nav><script>const BANK=[{"t":0,"q":"根据《中华人民共和国旅游法》，旅游者有权自主选择旅游产品和服务，并拒绝旅游经营者的哪种行为？","a":["强制交易","出示服务说明","依法核验身份","介绍行程"],"k":0,"e":"旅游者享有自主选择权，有权拒绝旅游经营者的强制交易行为。","id":"old0","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":0,"q":"下列哪项属于旅游者依法享有的权利？","a":["要求导游无条件更改所有行程","要求旅行社隐瞒危险信息","知悉其购买的旅游产品和服务的真实情况","不遵守旅游目的地公共秩序"],"k":2,"e":"旅游者对所购旅游产品和服务享有知情权。","id":"old1","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":1,"q":"旅行社组织旅游活动，通常应当与旅游者订立哪一种形式的合同？","a":["仅口头合同","书面合同","无需合同","仅短信表情确认"],"k":1,"e":"旅行社组织和安排旅游活动，应当与旅游者订立合同；包价旅游合同应采用书面形式。","id":"old2","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":1,"q":"在包价旅游合同中，以下哪项通常属于应当载明的事项？","a":["导游的私人住址","游客个人存款情况","旅游行程安排","游客私人通讯录"],"k":2,"e":"包价旅游合同应包括旅游行程安排等重要内容。","id":"old3","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":2,"q":"旅游者在人身、财产安全遇到危险时，有权请求谁给予救助和保护？","a":["仅其他游客","旅游经营者、当地政府和相关机构","仅旅游景点摄影师","仅旅游博主"],"k":1,"e":"《旅游法》规定旅游者在人身、财产安全遇到危险时，有权请求救助和保护。","id":"old4","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":2,"q":"旅游者应当尊重旅游目的地的哪些方面？","a":["当地文化传统和风俗习惯","只遵守出发地的风俗","只尊重购物场所规定","无需遵守公共秩序"],"k":0,"e":"旅游者应尊重当地风俗习惯、文化传统和宗教信仰等。","id":"old5","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":3,"q":"导游从事导游活动时，对旅游者的人身安全风险，应当如何处理？","a":["完全不予提示","仅向同事提示","及时作出真实说明和明确警示","事故后才说明"],"k":2,"e":"对可能危及旅游者人身、财产安全的情况，导游应作出真实说明和明确警示，并采取必要措施。","id":"old6","cat":"全国笔试","source":"原创练习 · 2026考纲考点"},{"t":3,"q":"关于导游执业，下列做法更符合职业规范的是？","a":["擅自增加购物活动","根据个人收益更改行程","诱导游客参加自费活动","按照合同和接待计划提供服务"],"k":3,"e":"导游应当遵守旅游合同约定和职业规范，不擅自变更行程。","id":"old7","cat":"全 function rotate(a,n){if(!a.length)return [];const offset=(new Date().getDate()*3+state.history.length*5)%a.length;return [...a.slice(offset),...a.slice(0,offset)].slice(0,n)}
function due(){let now=new Date();now.setHours(0,0,0,0);return Object.keys(state.review).filter(id=>byid[id]&&new Date(state.review[id].due+'T00:00:00')<=now)}
function begin(which,d){let a=[];let di=d??day();if(which==='today'||which==='day'){let cats=(di<=6?['北京地方','六大讲解']:di<=8?['业务法规','全国笔试']:di<=10?['业务法规','全国笔试']:di<=14?['全国笔试','北京地方']:di===15?['历年回忆']:di===16?['六大讲解','北京地方']:['全国笔试','北京地方','六大讲解','业务法规','历年回忆']);a=rotate(BANK.filter(x=>cats.includes(x.cat)),8);let pending=BANK.filter(x=>state.wrong[x.id]&&!a.includes(x));let review=rotate(pending,2);a=a.slice(0,8-review.length).concat(review);}
else if(which==='review')a=due().map(x=>byid[x]).filter(Boolean).slice(0,30);else if(which==='wrong')a=Object.keys(state.wrong).map(x=>byid[x]).filter(Boolean).slice(0,40);else if(which==='beijing')a=rotate(BANK.filter(x=>['北京地方','六大讲解'].includes(x.cat)),15);else if(which==='recall')a=rotate(BANK.filter(x=>x.cat==='历年回忆'),20);else a=rotate(BANK.filter(x=>category==='全部'||x.cat===category),15);
if(!a.length){alert(which==='review'?'今天没有到期的复习题，先练其他关卡吧。':'当前没有可练的错题。');return}deck=a;qi=0;score=0;answer=null;mode=which;focusDay=di;jump('quiz')}
function dateAfter(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function choose(i){if(answer!==null)return;let q=deck[qi];answer=i;let r=state.review[q.id]||{level:0};if(i===q.k){score++;state.xp+=10;delete state.wrong[q.id];r.level=Math.min(3,r.level+1);r.due=dateAfter([0,1,3,7][r.level]);}else{state.wrong[q.id]=(state.wrong[q.id]||0)+1;r.level=0;r.due=dateAfter(1)}state.review[q.id]=r;save();render()}
function next(){qi++;answer=null;if(qi===deck.length){if(mode==='today'||mode==='day')state.done[focusDay]=dateAfter(0);state.history.push({date:dateAfter(0),kind:mode,score,total:deck.length});save();jump('result')}else render()}
function selectSite(i){stopTimer();speakingIndex=i;seconds=180;render()}
function timefmt(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}
function stopTimer(){if(tick!==null){clearInterval(tick);tick=null}}
function toggleTimer(){if(tick!==null){stopTimer();render();return}tick=setInterval(()=>{seconds=Math.max(0,seconds-1);let c=$('clock');if(c)c.textContent=timefmt(seconds);if(seconds===0){stopTimer();let b=$('timerbtn');if(b)b.textContent='已结束 · 重新计时';}},1000);let b=$('timerbtn');if(b)b.textContent='⏸ 暂停计时'}
function resetTimer(){stopTimer();seconds=180;render()}
function markSpoken(){state.spoken[speakingIndex]=(state.spoken[speakingIndex]||0)+1;state.xp+=15;save();render()}
