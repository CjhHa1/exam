<script>const DATA=[{"id":"gap26-001","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"中国共产党第二十次全国代表大会召开于哪一年？","options":["2020年","2021年","2022年","2023年"],"answer":2,"explanation":"党的二十大于2022年召开。"},{"id":"gap26-002","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"新发展理念的完整表述是？","options":["创新、协调、绿色、开放、共享","富强、民主、文明、和谐、自由","改革、发展、稳定、安全、协调","创新、创业、创造、增长、开放"],"answer":0,"explanation":"新发展理念是创新、协调、绿色、开放、共享。"},{"id":"gap26-003","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"新时代我国社会主要矛盾中，人民的需求是什么？","options":["日益增长的物质文化需要","日益增长的美好生活需要","日益增长的旅游需要","日益增长的出境旅游需要"],"answer":1,"explanation":"主要矛盾表述为人民日益增长的美好生活需要与不平衡不充分的发展之间的矛盾。"},{"id":"gap26-004","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"“五位一体”总体布局不包括哪项？","options":["经济建设","政治建设","生态文明建设","军事建设"],"answer":3,"explanation":"五位一体是经济、政治、文化、社会和生态文明建设。"},{"id":"gap26-005","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"“四个全面”战略布局中的法治相关内容是？","options":["全面依法治国","全面振兴乡村","全面发展旅游","全面增加贸易"],"answer":0,"explanation":"全面依法治国属于“四个全面”。"},{"id":"gap26-006","unit":"1-1","group":"思想与重要会议精神","subject":1,"q":"2021年是中国共产党成立多少周年？","options":["70周年","80周年","90周年","100周年"],"answer":3,"explanation":"中国共产党于1921年成立。"},{"id":"gap26-007","unit":"1-2","group":"时事政治与年度记忆","subject":1,"q":"2026年属于哪个五年规划的开局之年？","options":["十三五","十四五","十五五","十六五"],"answer":2,"explanation":"十五五时期为2026年至2030年。"},{"id":"gap26-008","unit":"1-2","group":"时事政治与年度记忆","subject":1,"q":"2025年是中国人民抗日战争暨世界反法西斯战争胜利多少周年？","options":["70周年","75周年","80周年","85周年"],"answer":2,"explanation":"1945年至2025年为80周年。"},{"id":"gap26-009","unit":"1-2","group":"时事政治与年度记忆","subject":1,"q":"2026年冬季奥林匹克运动会由哪组城市举办？","options":["北京和张家口","米兰和科尔蒂纳丹佩佐","巴黎和里昂","洛杉矶和旧金山"],"answer":1,"explanation":"2026年冬奥会举办地为意大利米兰—科尔蒂纳。"},{"id":"gap26-010","unit":"1-2","group":"时事政治与年度记忆","subject":1,"q":"2026年男子足球世界杯由哪三个国家联合举办？","options":["美国、加拿大、墨西哥","德国、法国、英国","中国、日本、韩国","巴西、阿根廷、乌拉圭"],"answer":0,"explanation":"2026年世界杯由加拿大、墨西哥、美国合办。"},{"id":"gap26-011","unit":"1-2","group":"时事政治与年度记忆","subject":1,"q":"2026年是中华人民共和国成立多少周年？","options":["75周年","76周年","77周年","78周年"],"answer":2,"explanation":"1949年成立，2026年为77周年。"},{"id":"gap26-012","unit":"1-3","group":"旅游业相关政策与经营规范","subject":1,"q":"“十五五”规划时期为哪组年份？","options":["2021—2025年","2024—2028年","2026—2030年","2031—2035年"],"answer":2,"explanation":"十五五对应2026年至2030年。"},{"id":"gap26-013","unit":"1-3","group":"旅游业相关政策与经营规范","subject":1,"q":"以下哪项更符合旅游业可持续发展？","options":["只追求游客数量","保护生态、兼顾当地社区","尽量扩张一次性消耗","无视资源承载力"],"answer":1,"explanation":"高质量旅游发展应兼顾生态、游客体验和社区利益。"},{"id":"gap26-014","unit":"1-3","group":"旅游业相关政策与经营规范","subject":1,"q":"旅行社能否通过合同格式条款免除法律规定的经营者责任？","options":["只要签字就可以","只要降价就可以","不得通过无效条款排除法定责任","口头声明即可"],"answer":2,"explanation":"格式条款不得不合理免除或减轻经营者责任。"},{"id":"gap26-015","unit":"1-3","group":"旅游业相关政策与经营规范","subject":1,"q":"哪种行为明显损害旅游市场秩序？","options":["明码标价","依法告知行程","强迫购物与虚假宣传","充分告知风险"],"answer":2,"explanation":"强迫购物、虚假宣传侵害游客合法权益。"},{"id":"gap26-016","unit":"1-3","group":"旅游业相关政策与经营规范","subject":1,"q":"对旅游安全风险，更应采取什么方法？","options":["只在事故发生后补救","事前识别、告知和预防","出现事故后隐瞒","完全由游客自担"],"answer":1,"explanation":"旅游经营者负有安全提示与风险防范等义务。"},{"id":"gap26-017","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅行社开展旅行社业务经营前依法应取得什么？","options":["旅行社业务经营许可","导游资格证书","星级饭店标志","景区等级证书"],"answer":0,"explanation":"经营旅行社业务需要取得相应许可。"},{"id":"gap26-018","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅行社的分社通常以谁的名义开展经营活动？","options":["分社独立法人名义","设立分社的旅行社名义","导游个人名义","旅游者代表名义"],"answer":1,"explanation":"分社不具有法人资格，其经营责任由设立社承担。"},{"id":"gap26-019","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅行社组织团队旅游时，导游应如何安排？","options":["游客私下任意聘请","旅行社依法委派","交由普通乘客兼职","由购物商店随意指派"],"answer":1,"explanation":"导游执业应符合接受旅行社委派等规定。"},{"id":"gap26-020","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅行社通过互联网售卖旅游产品，是否仍承担旅行社相关法定义务？","options":["线上就不承担","只承担页面维护责任","仍依法承担经营者义务","只需由游客承担"],"answer":2,"explanation":"线上经营不能规避法定义务。"},{"id":"gap26-021","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅游产品广告宣传应遵循哪项原则？","options":["可夸大住宿等级","真实、准确，不误导","可以隐藏收费项目","只需旅游者自行判断"],"answer":1,"explanation":"经营者应保证宣传真实，不得虚假宣传。"},{"id":"gap26-022","unit":"1-9","group":"旅行社管理与经营","subject":1,"q":"旅行社计划变更合同重要行程，应如何处理？","options":["导游单方面决定","依法依约协商，不擅自变更","票价低就可任意改变","直接取消游客知情权"],"answer":1,"explanation":"合同变更需要符合法定和约定条件。"},{"id":"gap26-023","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"下列哪一项属于典型的不可移动文物？","options":["古建筑遗址","纪念品钥匙扣","旅游导览小册子","普通车票"],"answer":0,"explanation":"古遗址、古建筑等属于不可移动文物的典型形式。"},{"id":"gap26-024","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"非物质文化遗产着重保护什么？","options":["仅保护建筑外立面","传统实践、表现与知识技能","普通旅游票据","现代商业海报"],"answer":1,"explanation":"非遗包括传统技艺、表演艺术、民俗等活态文化。"},{"id":"gap26-025","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"下列哪一项更接近非物质文化遗产？","options":["传统剪纸技艺","石窟建筑本体","古城墙本体","古塔本体"],"answer":0,"explanation":"剪纸属于传统美术技艺的非遗范畴。"},{"id":"gap26-026","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"参观文物古迹时哪种做法正确？","options":["石刻题字","私自触摸壁画","遵守保护规定","翻越护栏拍照"],"answer":2,"explanation":"游客应遵守文物保护和参观规定。"},{"id":"gap26-027","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"博物馆藏品管理的重要目的是什么？","options":["让游客随意触摸","保护、研究并合理展示","允许藏品不登记","取消安全保卫"],"answer":1,"explanation":"博物馆承担收藏、保护、研究、展示与教育等职能。"},{"id":"gap26-028","unit":"1-12","group":"文物、非遗与旅游资源保护","subject":1,"q":"历史文化资源旅游开发应坚持什么原则？","options":["先拆除后宣传","保护优先、合理利用","只按票房收入决策","全面取消限制"],"answer":1,"explanation":"开发应服从文化遗产保护要求。"},{"id":"gap26-029","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"旅游团队多人出现疑似食物中毒症状，导游应首先？","options":["继续行程","及时安排就医并报告","让游客自行用药","删除就餐记录"],"answer":1,"explanation":"应先救助患者、控制风险并依法报告。"},{"id":"gap26-030","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"饭店接触住宿客人的个人信息，应如何处理？","options":["允许在公共群聊发布","依法保护个人信息","出售给广告公司","公开张贴身份证号"],"answer":1,"explanation":"住宿信息涉及隐私和个人信息保护。"},{"id":"gap26-031","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"食品经营者对食品安全应采取哪种态度？","options":["仅投诉后负责","依法承担主体责任","由游客完全承担","口头承诺即可"],"answer":1,"explanation":"食品经营者负有法定食品安全责任。"},{"id":"gap26-032","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"发现酒店消防疏散通道堆放杂物，导游应？","options":["视而不见","提醒酒店及时排除隐患","把游客行李继续堆放","主动锁闭通道"],"answer":1,"explanation":"安全出口和疏散通道应当保持畅通。"},{"id":"gap26-033","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"旅客明确告知严重食物过敏史，导游应？","options":["保证所有菜品绝不过敏","向餐厅核实配料并提醒风险","要求游客试吃","故意不告知餐厅"],"answer":1,"explanation":"需要沟通、核实并避免无依据的安全保证。"},{"id":"gap26-034","unit":"1-13","group":"食品、住宿与娱乐场所安全","subject":1,"q":"公共娱乐场所发生火情时，导游应优先？","options":["组织游客拍摄","协助安全疏散并报警","锁闭出口避免混乱","坚持完成讲解"],"answer":1,"explanation":"火灾初期应报警、疏散、保障人员生命安全。"},{"id":"gap26-035","unit":"1-14","group":"出入境与交通","subject":1,"q":"中国公民出境旅游行前最需要核验哪组证件？","options":["身份证和驾驶证","有效护照、签证或其他所需入境文件","购物优惠券","酒店宣传单"],"answer":1,"explanation":"出境须按目的地规则核查有效旅行证件和入境要求。"},{"id":"gap26-036","unit":"1-14","group":"出入境与交通","subject":1,"q":"团员境外遗失护照，通常应联系哪个机构寻求补办旅行证件帮助？","options":["中国驻外使领馆","当地纪念品商店","无资质票贩","旅游购物商场"],"answer":0,"explanation":"护照遗失可按要求报警，并联系中国驻外使领馆等。"},{"id":"gap26-037","unit":"1-14","group":"出入境与交通","subject":1,"q":"航班取消时导游最合理的措施是？","options":["隐瞒消息","核实航司安排并协调后续服务","要求全部游客散团","擅自许诺赔偿金额"],"answer":1,"explanation":"应及时核实情况并协调改签、食宿等。"},{"id":"gap26-038","unit":"1-14","group":"出入境与交通","subject":1,"q":"旅游者携带受申报管理物品进出境，应依什么办理？","options":["购物店口头推荐","海关现行规定","导游个人惯例","多数游客意见"],"answer":1,"explanation":"应遵守海关申报和物品进出境规定。"},{"id":"gap26-039","unit":"1-14","group":"出入境与交通","subject":1,"q":"乘高铁前导游最应该核对？","options":["实名乘车证件、车次与检票时间","纪念品颜色","讲解稿长度","旅客餐饮喜好"],"answer":0,"explanation":"实名乘车需核对有效证件及乘车信息。"},{"id":"gap26-040","unit":"1-14","group":"出入境与交通","subject":1,"q":"口岸边检依法拒绝部分团员出境，导游应？","options":["教其绕过查验","协助合法处理并调整团队行程","使用假证","强行阻挡检查"],"answer":1,"explanation":"应遵守依法开展的边检查验。"},{"id":"gap26-041","unit":"2-1","group":"导游业务基础与职责","subject":2,"q":"地陪主要负责什么？","options":["目的地当地接待和讲解服务","全程管理国际航空交通","旅馆财务审计","边检审批"],"answer":0,"explanation":"地陪提供当地接待、游览安排和讲解。"},{"id":"gap26-042","unit":"2-1","group":"导游业务基础与职责","subject":2,"q":"全陪导游典型职责是什么？","options":["全程联络、协调并监督接待质量","只在单个博物馆驻场","审批景区门票价","指挥机场交通"],"answer":0,"explanation </h2>${GROUPS.map(g=>{let a=DATA.filter(q=>q.unit===g.id),n=a.filter(q=>saved[q.id]).length;return `<div class="group"><div><b>${escapeHtml(g.title)}</b><div class="muted">科目${['','一','二','三','四'][g.subject]} · ${n}/${a.length}题已做</div></div><button onclick="start('unit','${g.id}')">刷题</button></div>`}).join('')}</section>`}function start(mode,unit=''){run=DATA.filter(q=>mode==='unseen'?!saved[q.id]:mode==='wrong'?saved[q.id]&&!saved[q.id].correct:mode==='paper1'?q.subject<3:mode==='paper2'?q.subject>2:mode==='unit'?q.unit===unit:true);if(mode==='quick')run=run.map(q=>({q,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.q).slice(0,30);if(!run.length){alert(mode==='wrong'?'目前没有需要复习的错题。':'该范围没有待做题，可改为全部题。');return}index=0;selected=-1;showing=false;render()}function render(){if(index>=run.length){finish();return}const q=run[index];el('app').innerHTML=`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><span class="pill">${escapeHtml(q.group)}</span><button onclick="home()">退出</button></div><p class="muted">第 ${index+1} / ${run.length} 题 · 自编模拟题</p><progress value="${index}" max="${run.length}"></progress><div class="question">${escapeHtml(q.q)}</div><div>${q.options.map((op,i)=>`<button class="option" id="op${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(op)}</button>`).join('')}</div><div id="explain"></div><button class="primary" id="next" style="width:100%" disabled onclick="next()">${index===run.length-1?'完成本组':'下一题 →'}</button></section>`}function answer(i){if(showing)return;const q=run[index];showing=true;selected=i;saved[q.id]={correct:i===q.answer,choice:i,at:new Date().toISOString()};save();q.options.forEach((_,j)=>{let b=el('op'+j);b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('explain').innerHTML=`<div class="answer"><b>${i===q.answer?'答对了':'这题记一下'}：${String.fromCharCode(65+q.answer)}. ${escapeHtml(q.options[q.answer])}</b><p>${escapeHtml(q.explanation)}</p></div>`;el('next').disabled=false}function next(){if(!showing)return;index++;showing=false;selected=-1;render()}function finish(){const count=run.filter(q=>saved[q.id]?.correct).length;el('app').innerHTML=`<section class="card"><h2>这组已完成！</h2><p style="font-size:30px;font-weight:800">${count} / ${run.length}</p><p>答错的题已记入本浏览器，可以再练。</p><div class="row"><button class="primary" onclick="start('wrong')">再练错题</button><button onclick="start('unseen')">继续新题</button><button onclick="home()">专题首页</button></div></section>`}home();</script></body></html>
